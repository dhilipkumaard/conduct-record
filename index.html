<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Continuous Assessment of Student Conduct Record – RKM Polytechnic College</title>
<style>
:root{--m:#8a3b0c;--m2:#fff4ea;--b:#e2d3c4;--t:#2b2118;--g:#5b6b3a}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Noto Sans Tamil,sans-serif;color:var(--t);background:#faf6f1}
header{background:var(--m);color:#fff;padding:14px 20px}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--b);align-items:end}
.bar label{font-size:12px;display:flex;flex-direction:column;gap:2px;font-weight:600}
main{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px 20px;max-width:1300px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
select,input,textarea{font:inherit;padding:6px 8px;border:1px solid #cdbba8;border-radius:6px;background:#fff;width:100%}
button{font:inherit;padding:6px 12px;border:1px solid var(--m);background:var(--m);color:#fff;border-radius:6px;cursor:pointer}
button.o{background:#fff;color:var(--m)}button.x{background:#fff;color:#a00;border-color:#d99}
.bar select{width:auto}ul.st{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
ul.st li{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
ul.st li:hover{background:var(--m2)}ul.st li.on{background:var(--m);color:#fff}.pill{font-size:11px;background:#eee;color:#333;border-radius:9px;padding:0 7px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.tabs button{background:#fff;color:var(--m)}.tabs button.on{background:var(--m);color:#fff}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.f label{font-size:12px;font-weight:600;display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border:1px solid var(--b);padding:5px 7px;text-align:left}th{background:var(--m2)}
tr.sec td{background:#f3e7da;font-weight:700}.sm{font-size:12px;color:#6b5b4b}.grade{font-size:26px;font-weight:700;color:var(--g)}
h3{margin:.2em 0 .6em;color:var(--m)}.empty{color:#8a7a6a;padding:20px;text-align:center}
.warn{background:#fff7d6;border:1px solid #e6d27a;padding:8px 10px;border-radius:8px;font-size:12.5px}
@media print{header~.bar,.tabs,button,ul.st,aside{display:none!important}main{display:block}}
</style></head><body>
<header><h1>Continuous Assessment of Student Conduct Record</h1>
<p>Ramakrishna Mission Polytechnic College · Ramakrishna Mission Students’ Home, Mylapore, Chennai</p></header>
<div class="bar">
 <label>Course<select id="course"></select></label>
 <label>Year<select id="year"></select></label>
 <span style="flex:1"></span>
 <button class="o" onclick="exportJSON()">Backup (JSON)</button>
 <button class="o" onclick="exportCSV()">Violations (CSV)</button>
 <button class="o" onclick="document.getElementById('imp').click()">Restore</button>
 <input type="file" id="imp" accept=".json" hidden onchange="importJSON(this)">
</div>
<main><aside><div class="card"><h3 id="lh">Students</h3><ul class="st" id="list"></ul>
<hr style="border:0;border-top:1px solid var(--b)"><div class="f"><label>Add student</label>
<input id="nn" placeholder="Name"><input id="nr" placeholder="Register No." style="margin-top:6px">
<div style="display:flex;gap:6px;margin-top:6px"><button onclick="addStu()">Add</button><button class="o" onclick="bulk()">Paste list…</button></div></div></div></aside>
<section id="view"></section></main>
<script>
const COURSES={DME:"Diploma in Mechanical Engineering",DAE:"Diploma in Automobile Engineering",DCE:"Diploma in Computer Engineering"};
const YEARS=["I","II","III"],KEY="rkm-conduct-v1";
const VALUES=[["I. Personal Character (தனிப்பட்ட குணநலம்)",["Sincerity (நேர்மை)","Self-Control (சுயக்கட்டுப்பாடு)","Self-Discipline (சுய-ஒழுக்கம்)","Concentration (ஒருமுகப்படுத்தல்)","Hard Work (கடின உழைப்பு)","Persistence (விடாமுயற்சி)","Punctuality (நேரந்தவறாமை)","Thrift (சிக்கனம்)"]],
["II. Personal Conduct (தனிநபர் நடத்தை)",["Obedience (கீழ்ப்படிதல்)","Cleanliness & Personal Hygiene (தூய்மை)","Self-Confidence (தன்னம்பிக்கை)","Adaptability (நெகிழ்வுத்திறன்)","Environmental Consciousness (சுற்றுச்சூழல் விழிப்புணர்வு)"]],
["III. Character & Moral Values (குணநலன் மற்றும் அறநெறிப் பண்புகள்)",["Truthfulness (உண்மைத் தன்மை)","Honesty (நேர்மை)","Integrity (ஒழுக்க நேர்மை)","Humility (பணிவு)"]],
["IV. Initiative & Responsibility (முன்முயற்சி மற்றும் பொறுப்புணர்வு)",["Dedication (அர்ப்பணிப்பு)","Commitment to Duty (கடமை உணர்வு)","Taking Responsibility (பொறுப்பேற்றல்)","Initiative (முன்முயற்சி)","Service Mind (சேவை மனப்பான்மை)"]],
["V. Social Behaviour (சமூக நடத்தை)",["Respect for Others (பிறரை மதித்தல்)","Trustworthiness (நம்பகத்தன்மை)","Cooperation (ஒத்துழைப்பு)","Helping Nature (உதவும் மனப்பான்மை)","Team Work (குழுப்பணி)","Communication Skills (தொடர்பாடல் திறன்)","Friendliness (நட்புணர்வு)"]]];
const GR=[[4,"O","Outstanding"],[3,"A","Excellent"],[2,"B","Good"],[1,"C","Needs Improvement"],[0,"D","Requires Immediate Attention"]];
const grade=a=>a==null?["–",""]:(g=>[g[1],g[2]])(GR.find(x=>a>=x[0]));
const VIOL={"Personal Discipline":["Late coming (classes/prayer/study/duties)","Sleeping during study hours","Unauthorised absence from study hours","Disturbing others during study hours","Improper dress / untidy appearance","Poor personal hygiene","Carelessness in personal responsibilities","Irresponsible behaviour","Disobedience to legitimate instructions","Repeated negligence in duties","Late return to Home without permission","Absence without permission while returning from Home","Leaving institution/hostel without permission","Abusive / vulgar / inappropriate language","Repeated disruption of others","Lying / giving false information","Hiding mistakes or misconduct","Misuse of electronic devices"],
"Academic Discipline":["Irregular class attendance","Late entry to classroom","Unauthorised absence from classes","Failure to complete assigned academic work","Late / non-submission of records / projects","Lack of interest in studies","Failure to attend remedial / special classes","Disturbing classroom teaching","Examination malpractice","Prohibited materials in examination hall","Copying / plagiarism in assignments"],
"Hostel & Home Life":["Neglect of hostel room cleanliness","Failure to maintain personal belongings","Neglect of campus cleanliness duties","Failure to perform community responsibilities","Disturbing hostel discipline","Excessive noise in study/rest hours","Leaving hostel without permission","Late return to hostel","Failure to observe prescribed study hours"],
"Student Misbehaviour":["Quarrelling","Fighting","Threatening / intimidating","Bullying","Teasing / insulting fellow students","Use of abusive language","Disrespect towards faculty, staff or elders","Disobedience","Non-cooperation in group activities","Instigating to violate rules"],
"Honesty & Integrity":["Stealing / attempted theft","Failure to report or surrender lost property","Cheating / dishonest misrepresentation","Forgery / falsification of signatures, documents, records","Concealing important information","Misusing institutional resources"],
"Damaging Home Property":["Damage to college / hostel property","Defacing walls, lifts, furniture, facilities","Careless handling of laboratory equipment","Damage to library books / sports equipment","Wasteful use of water, electricity, resources","Wastage of food, cosmetics etc.","Irresponsible disposal of usable clothes","Improper disposal / segregation of waste"],
"Health, Well-being & Safety":["Tobacco use / smoking","Alcohol consumption","Possession or use of prohibited drugs / intoxicants","Misuse of social media affecting studies/sleep/duties","Failure to follow health and safety instructions","Dangerous pranks / risky behaviour","Unsafe behaviour in laboratories / workshops","Failure to report illness or accidents"],
"Daily Prayers & Institutional Discipline":["Absence from daily prayer / meditation without permission","Disturbing prayer / value education sessions","Failure to observe silence in Prayer Hall","Disrespect towards institutional traditions","Failure to observe specific institutional rules"],
"Higher-Level Misconduct":["Ragging","Physical assault","Sexual harassment","Possession of prohibited or dangerous items","Serious damage to institutional property","Repeated violent behaviour","Drug or alcohol use"]};
const SEV=["Level 1 – Minor / First occurrence (Faculty)","Level 2 – Moderate / Repeated (Mentor/Counsellor)","Level 3 – Severe / Persistent (Department Assessment Committee-I)","Level 4 – Critical / Serious or continued (Corrective Guidance Committee-II)"];
const YN=["No","Yes"],WT=["Friendly advice","Personal counselling","Verbal warning","Written warning"];
const CASEF=[["Violation",[["cat","Category","s",Object.keys(VIOL)],["type","Type of rule violation","v"],["sev","Nature / severity","s",SEV],["date","Date of violation","date"],["place","Place of occurrence","t"],["desc","Brief description (facts only)","a"]]],
["Warning given",[["warn","Warning given?","s",YN],["wtype","Type of warning","s",WT],["wdate","Date of warning","date"],["wby","Given by","t"],["wresp","Student response","a"]]],
["Corrective Guidance Committee decision",[["review","Committee review held?","s",YN],["guide","Guidance recommended","a"],["decision","Decision / recommendation","a"],["resp","Responsible person","t"],["ddate","Decision date","date"]]],
["Corrective action taken",[["act","Corrective action","a"],["couns","Counselling / guidance","a"],["parent","Parent / guardian communication","s",["Not required","Informed by phone","Called to institution","Letter sent"]],["refer","Referral to HOD / Principal","s",["No","HOD","Principal"]],["other","Other action (e.g. Suspension / TC – per institutional rules)","a"],["adate","Date of action","date"]]],
["Follow-up",[["fu","Follow-up required?","s",YN],["fudate","Follow-up date","date"],["fuby","Follow-up by","t"],["furesp","Student response","a"],["imp","Improvement status","s",["–","Improving","No change","Deteriorating"]],["further","Further guidance required","a"],["out","Final outcome","s",["Open","Positive reinforcement given","Case closed"]]]]];
const SC=[["name","Student name"],["reg","Register No."],["dob","Date of birth"],["blood","Blood group"],["parent","Parent / guardian name"],["phone","Parent contact no."],["addr","Address"],["hostel","Hostel / Day scholar"],["mentor","Faculty mentor"]];
const COMM=["Class Teacher","HOD","Mentor / Counsellor","Warden","Principal"];
let DB=JSON.parse(localStorage.getItem(KEY)||'{"s":[]}'),S={c:"DME",y:"I",id:null,tab:"c"};
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB)),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>DB.s.find(x=>x.id==S.id),cls=()=>DB.s.filter(x=>x.c==S.c&&x.y==S.y).sort((a,b)=>a.name.localeCompare(b.name));
document.getElementById("course").innerHTML=Object.entries(COURSES).map(([k,v])=>`<option value="${k}">${k} – ${v}</option>`).join("");
document.getElementById("year").innerHTML=YEARS.map(y=>`<option>${y}</option>`).join("");
course.onchange=()=>{S.c=course.value;S.id=null;draw()};year.onchange=()=>{S.y=year.value;S.id=null;draw()};
function addStu(){const n=nn.value.trim();if(!n)return;DB.s.push(mk(n,nr.value.trim()));nn.value=nr.value="";save();draw()}
const mk=(name,reg)=>({id:uid(),c:S.c,y:S.y,name,reg,p:{},r:{},pos:[],obs:[],cases:[]});
function bulk(){const t=prompt("Paste student names, one per line (optional: 'Name, RegNo'):");if(!t)return;t.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{const[a,b]=l.split(",");DB.s.push(mk(a.trim(),(b||"").trim()))});save();draw()}
function setp(path,v){const s=cur();const k=path.split(".");let o=s;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=v;if(path=="name"||path=="reg"){s[path]=v}save()}
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.p){setp(t.dataset.p,t.value);if(t.dataset.r)draw(1)}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.p&&!t.dataset.r&&t.tagName!="SELECT")setp(t.dataset.p,t.value)});
const fld=(p,l,t,o,v)=>`<div class="f"><label>${l}</label>${t=="a"?`<textarea rows="2" data-p="${p}">${esc(v)}</textarea>`:t=="s"?`<select data-p="${p}">${["",...o].map(x=>`<option${x==v?" selected":""}>${esc(x)}</option>`).join("")}</select>`:t=="v"?"":`<input type="${t=="date"?"date":"text"}" data-p="${p}" value="${esc(v)}">`}</div>`;
function stats(s){let tot=0,n=0,secs=VALUES.map((sec,i)=>{let a=0,c=0;sec[1].forEach((_,j)=>{const r=+s.r[i+"-"+j];if(r){a+=r;c++}});tot+=a;n+=c;return[c?a/c:null,c]});return{secs,avg:n?tot/n:null,n}}
function draw(keep){const L=cls();document.getElementById("lh").textContent=`${S.c} – Year ${S.y} (${L.length})`;
list.innerHTML=L.map((s,i)=>`<li class="${s.id==S.id?"on":""}" onclick="S.id='${s.id}';S.tab='c';draw()"><span>${i+1}. ${esc(s.name)}</span>${s.cases.length?`<span class="pill">${s.cases.length}</span>`:""}</li>`).join("")||'<div class="sm">No students yet.</div>';
const s=cur();if(!s){view.innerHTML=`<div class="card empty">Select a student (or add one) to begin.<br><span class="sm">${COURSES[S.c]} · Year ${S.y}</span></div>`;return}
const T=[["c","1. Student Conduct"],["m","2. Misconduct / Indiscipline Record"]];
view.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>${esc(s.name)} <span class="sm">${S.c} · Year ${S.y}</span></h3><div><button class="o" onclick="print()">Print</button> <button class="x" onclick="delStu()">Delete student</button></div></div>
<div class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="S.tab='${t[0]}';draw()">${t[1]}</button>`).join("")}</div>${S.tab=="c"?conduct(s):misc(s)}</div>`}
function conduct(s){const st=stats(s),[g,gl]=grade(st.avg);
return `<h3>A. Student particulars</h3><div class="g2">${SC.map(([k,l])=>fld(k=="name"||k=="reg"?k:"p."+k,l,"t",0,k=="name"||k=="reg"?s[k]:s.p[k])).join("")}</div>
<h3 style="margin-top:18px">B. Conduct assessment <span class="sm">(rate each value 1–5; teacher guidelines: see below)</span></h3>
<div class="warn">Before rating: Have I listened? Understood the reason? Am I objective, correcting not merely criticising? Have I appreciated improvement, kept confidentiality and treated all students equally? One incident does not define character – rate on consistent patterns.</div>
<div style="overflow:auto"><table style="margin-top:8px"><tr><th>#</th><th>Value</th><th>Rating (1=D … 5=O)</th></tr>${VALUES.map((sec,i)=>`<tr class="sec"><td colspan="2">${sec[0]}</td><td>${st.secs[i][0]?st.secs[i][0].toFixed(2)+" · "+grade(st.secs[i][0])[0]:"–"}</td></tr>`+sec[1].map((v,j)=>`<tr><td>${j+1}</td><td>${v}</td><td><select data-r="1" data-p="r.${i}-${j}" style="width:90px">${["","1","2","3","4","5"].map(x=>`<option${x==(s.r[i+"-"+j]||"")?" selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")).join("")}</table></div>
<div style="display:flex;gap:18px;align-items:center;margin:10px 0"><div class="grade">${g}</div><div>Overall average <b>${st.avg?st.avg.toFixed(2):"–"}</b> (${st.n}/29 rated) ${gl?"· "+gl:""}<div class="sm">Scale: O 4–5 · A 3–4 · B 2–3 · C 1–2 · D 0–1. Rating reflects conduct only – never a punishment for academic difficulty or personal circumstances.</div></div></div>
<div class="g2">${fld("p.committee","Department committee members / assessed by","t",0,s.p.committee)}${fld("p.period","Assessment period","t",0,s.p.period)}</div>
<h3 style="margin-top:18px">C. Positive conduct / appreciation</h3>${list2(s,"pos","Appreciation / achievement")}
<h3 style="margin-top:18px">D. Observation details <span class="sm">(facts, not labels)</span></h3>${list2(s,"obs","Objective observation")}`}
function list2(s,k,ph){return `<table>${s[k].map((e,i)=>`<tr><td style="width:140px"><input type="date" data-p="${k}.${i}.d" value="${esc(e.d)}"></td><td><input data-p="${k}.${i}.t" placeholder="${ph}" value="${esc(e.t)}"></td><td style="width:40px"><button class="x" onclick="rm('${k}',${i})">×</button></td></tr>`).join("")}</table><button class="o" style="margin-top:6px" onclick="add('${k}')">+ Add entry</button>`}
const add=k=>{cur()[k].push({d:new Date().toISOString().slice(0,10),t:""});save();draw()};
const rm=(k,i)=>{cur()[k].splice(i,1);save();draw()};
function misc(s){return (s.cases.length?s.cases.map((c,i)=>`<div class="card" style="background:#fffdfb"><div style="display:flex;justify-content:space-between"><b>Case ${i+1}${c.type?" – "+esc(c.type):""}</b><button class="x" onclick="rmCase(${i})">Delete case</button></div>
<div class="sm" style="margin:4px 0 8px">Flow: Record → Establish facts → Assess risk → Corrective guidance → Action → Follow-up</div>
${CASEF.map(([t,fs])=>`<h3>${t}</h3><div class="g2">${fs.map(([k,l,ty,o])=>k=="type"?`<div class="f"><label>${l}</label><select data-p="cases.${i}.type">${["",...(VIOL[c.cat]||[])].map(x=>`<option${x==c.type?" selected":""}>${esc(x)}</option>`).join("")}</select></div>`:fld(`cases.${i}.${k}`,l,ty,o,c[k])).join("")}</div>`).join("")}</div>`).join(""):'<div class="empty">No violation recorded – conduct is clear (Violation: No).</div>')+`<button onclick="addCase()">+ Record a rule violation</button>`}
function addCase(){cur().cases.push({cat:Object.keys(VIOL)[0],date:new Date().toISOString().slice(0,10)});save();draw()}
function rmCase(i){if(confirm("Delete this case record?")){cur().cases.splice(i,1);save();draw()}}
function delStu(){if(confirm("Delete this student and all records?")){DB.s=DB.s.filter(x=>x.id!=S.id);S.id=null;save();draw()}}
const dl=(n,t,m)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const exportJSON=()=>dl("conduct-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(DB),"application/json");
function exportCSV(){const h=["Course","Year","Student","Reg No","Category","Violation","Severity","Date","Place","Description","Warning","Warning type","Committee decision","Action","Parent","Follow-up","Status","Outcome"];
const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const rows=[];DB.s.forEach(s=>s.cases.forEach(c=>rows.push([s.c,s.y,s.name,s.reg,c.cat,c.type,c.sev,c.date,c.place,c.desc,c.warn,c.wtype,c.decision,c.act,c.parent,c.fudate,c.imp,c.out].map(q).join(","))));
dl("violations.csv","\ufeff"+[h.join(","),...rows].join("\n"),"text/csv")}
function importJSON(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.s))throw 0;if(confirm("Replace current data with this backup?")){DB=d;save();draw()}}catch{alert("Invalid backup file")}})}
draw();
</script></body></html>
